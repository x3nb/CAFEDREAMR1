<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Vampiro+One&display=swap" rel="stylesheet">
    <title>CafeDreamr Loading Page</title>
    <style>
        body {
            background-color: #5c4b8a; /* Deep purple */
            font-family: 'Vampiro One', cursive;
            color: cornflowerblue;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #teacup {
            width: 200px;
            height: 200px;
            background-image: url('https://example.com/teacup.png'); /* replace with actual teacup image URL */
            background-size: cover;
            animation: tilt 2s infinite alternate;
        }

        @keyframes tilt {
            from { transform: rotate(10deg); }
            to { transform: rotate(-10deg); }
        }

        .title {
            display: block;
            margin-top: 20px;
            font-size: 2em;
            text-decoration: none;
            color: cornflowerblue;
        }
    </style>
</head>
<body>
    <div id="teacup"></div>
    <a href="https://cafedreamr.art" class="title">CafeDreamr</a>
</body>
</html>
